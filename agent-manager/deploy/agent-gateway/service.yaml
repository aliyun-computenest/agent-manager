apiVersion: v1
kind: Service
metadata:
  name: openclaw-agent-gateway
  labels:
    app: openclaw-agent-gateway
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-id: "__GATEWAY_SLB_ID__"
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-force-override-listeners: "true"
spec:
  type: LoadBalancer
  selector:
    app: openclaw-agent-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
