site_name: Agent Manager
site_description: 企业级 Agent 管控平台使用文档
site_url: https://aliyun-computenest.github.io/agent-manager/
repo_url: https://github.com/aliyun-computenest/agent-manager
repo_name: aliyun-computenest/agent-manager

docs_dir: docs/user-docs
site_dir: site

theme:
  name: aliyuncomputenest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - fenced_code

nav:
  - 首页: index.md
  - 管理员指南:
      - 服务实例部署与计费: 服务实例部署与计费.md
      - 用户登录与分组管理: 用户登录与分组管理.md
      - 配置 Agent 类型: 配置Agent类型.md
      - 配置 SandboxSet: 配置SandboxSet.md
      - 技能管理: 技能管理.md
      - 创建和管理 Agent 实例: 创建和管理Agent实例.md
      - Agent 备份: Agent备份.md
      - Agent 升级: Agent升级.md
      - 配置网关: 配置网关.md
  - 用户指南: 用户指南.md
  - 运维与排障:
      - 常见问题与排障: 常见问题与排障.md
      - 数据库备份恢复: 更换Supabase数据库操作指南.md
      - E2B 证书与域名变更: E2B证书与域名变更指南.md
  - 发布记录:
      - 版本总览: release-notes/README.md
      - v1.0.7: release-notes/v1.0.7.md
      - v1.0.6: release-notes/v1.0.6.md
      - v1.0.5: release-notes/v1.0.5.md
      - v1.0.4: release-notes/v1.0.4.md
      - v1.0.3: release-notes/v1.0.3.md
      - v1.0.2: release-notes/v1.0.2.md
      - v1.0.1: release-notes/v1.0.1.md
      - v1.0.0: release-notes/v1.0.0.md
  - English: index-en.md
